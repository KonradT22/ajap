<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}AJAP{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { font-size: 0.875rem; background: #f8f9fa; }
    .navbar-brand { font-weight: 700; letter-spacing: -0.5px; }
    .track-de   { background: #0d6efd; color: #fff; }
    .track-mle  { background: #6f42c1; color: #fff; }
    .track-swe  { background: #198754; color: #fff; }
    .status-new         { background: #6c757d; color: #fff; }
    .status-interested  { background: #ffc107; color: #000; }
    .status-applied     { background: #198754; color: #fff; }
    .status-skipped     { background: #dee2e6; color: #495057; }
    .status-interviewing{ background: #0dcaf0; color: #000; }
    .status-rejected    { background: #dc3545; color: #fff; }
    .status-offer       { background: #d63384; color: #fff; }
    .status-btn { font-size: 0.72rem; padding: 0.15rem 0.45rem; }
    .btn-grp-status .btn { border-radius: 4px; margin-right: 2px; }
    table th { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.04em;
               white-space: nowrap; }
    table td { vertical-align: middle; }
    .col-company { min-width: 130px; max-width: 180px; }
    .col-title   { min-width: 180px; }
    .col-track   { width: 130px; white-space: nowrap; }
    .col-type    { width: 80px; }
    .col-source  { width: 140px; }
    .col-date    { width: 90px; white-space: nowrap; }
    .col-loc     { max-width: 150px; }
    .col-status  { width: 170px; white-space: nowrap; }
    .truncate    { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sort-link   { color: inherit; text-decoration: none; }
    .sort-link:hover { text-decoration: underline; }
    .filter-bar  { background: #fff; border-bottom: 1px solid #dee2e6; padding: 0.6rem 1rem; }
    .stat-pill   { font-size: 0.72rem; }
    .shortlist-card { border-left: 4px solid #dee2e6; }
    .shortlist-card.de  { border-color: #0d6efd; }
    .shortlist-card.mle { border-color: #6f42c1; }
    .shortlist-card.swe { border-color: #198754; }
    .desc-preview { font-size: 0.78rem; color: #6c757d; margin-top: 0.4rem;
                    display: -webkit-box; -webkit-line-clamp: 3;
                    -webkit-box-orient: vertical; overflow: hidden; }
    .fit-strong { background: #198754; color: #fff; }
    .fit-medium { background: #ffc107; color: #000; }
    .fit-weak   { background: #adb5bd; color: #fff; }
    .badge-pick { background: #e9ecef; color: #495057; font-family: monospace; font-size: 0.7rem; }
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3 py-2">
  <a class="navbar-brand" href="/">AJAP</a>
  <div class="navbar-nav me-auto">
    <a class="nav-link {% if request.endpoint == 'shortlist' %}active{% endif %}" href="/shortlist">
      ★ Strong Fits
    </a>
    <a class="nav-link {% if request.endpoint == 'index' %}active{% endif %}" href="/">
      All Roles
    </a>
  </div>
</nav>
{% block content %}{% endblock %}
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
function setStatus(jobHash, status, btn) {
  const row = btn.closest('tr') || btn.closest('.shortlist-card');
  const badge = row ? row.querySelector('.status-badge') : null;
  const oldStatus = badge ? badge.textContent.trim() : 'NEW';
  // Toggle: clicking the already-active status reverts to NEW
  const targetStatus = (oldStatus === status) ? 'NEW' : status;

  fetch('/api/status', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({job_hash: jobHash, status: targetStatus})
  })
  .then(r => r.json())
  .then(data => {
    if (!data.ok) return;
    if (badge) {
      badge.textContent = targetStatus;
      badge.className = 'badge status-badge ' + statusCls(targetStatus);
    }
    row.querySelectorAll('.status-btn').forEach(b => {
      const s = b.dataset.status;
      b.className = 'btn status-btn ' + (s === targetStatus ? activeCls(s) : outlineCls(s));
    });
    // Keep filter-bar stat counters in sync
    adjustStat(oldStatus, -1);
    adjustStat(targetStatus, +1);
  });
}
function adjustStat(status, delta) {
  let pill = document.querySelector('[data-stat="' + status + '"]');
  if (pill) {
    const m = pill.textContent.match(/:\s*(\d+)/);
    if (m) {
      const n = Math.max(0, parseInt(m[1]) + delta);
      pill.textContent = status + ': ' + n;
    }
  } else if (delta > 0) {
    const ref = document.querySelector('[data-stat]');
    if (ref) {
      pill = document.createElement('span');
      pill.className = 'badge stat-pill ' + statusCls(status) + ' ms-1';
      pill.setAttribute('data-stat', status);
      pill.textContent = status + ': 1';
      ref.parentNode.appendChild(pill);
    }
  }
}
function statusCls(s) {
  return {'NEW':'status-new','INTERESTED':'status-interested','APPLIED':'status-applied',
          'SKIPPED':'status-skipped','INTERVIEWING':'status-interviewing',
          'REJECTED':'status-rejected','OFFER':'status-offer'}[s] || 'status-new';
}
function activeCls(s) {
  return {'NEW':'btn-secondary','INTERESTED':'btn-warning','APPLIED':'btn-success',
          'SKIPPED':'btn-light','INTERVIEWING':'btn-info',
          'REJECTED':'btn-danger','OFFER':'btn-pink'}[s] || 'btn-secondary';
}
function outlineCls(s) {
  return {'NEW':'btn-outline-secondary','INTERESTED':'btn-outline-warning',
          'APPLIED':'btn-outline-success','SKIPPED':'btn-outline-secondary',
          'INTERVIEWING':'btn-outline-info','REJECTED':'btn-outline-danger',
          'OFFER':'btn-outline-secondary'}[s] || 'btn-outline-secondary';
}
</script>
</body>
</html>
